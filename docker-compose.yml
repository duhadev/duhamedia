# LOCAL DEV ONLY: Postgres for `pnpm dev`. The app runs on the host.
# Image major is PROVISIONAL (17) until the server's Postgres major is known
# (OPS_REQUESTS #6) — then pin to that major for dev parity.
services:
  postgres:
    image: postgres:17-alpine
    container_name: duhamedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: duha
      POSTGRES_PASSWORD: duha # local-only throwaway credential
      POSTGRES_DB: duha_site_dev
    ports:
      # Host port 5433 (not 5432) to avoid clashing with other local Postgres instances.
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duha -d duha_site_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
