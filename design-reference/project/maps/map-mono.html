<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#FAF7F2;font-family:'DM Sans',system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .leaflet-tile-pane{filter:grayscale(1) contrast(1.05) brightness(1.04) sepia(0.12)}
  .pin{width:20px;height:20px;background:#C20E59;border:3px solid #111;transform:rotate(45deg)}
  .leaflet-container{background:#EDE9E2}
  .stamp{position:absolute;left:0;bottom:0;z-index:500;background:#111;color:#FAF7F2;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:8px 12px}
</style>
</head>
<body>
<div id="map"></div>
<div class="stamp">Chicago, IL · 41.88°N 87.62°W</div>
<script>
  const map = L.map('map', { zoomControl: false, scrollWheelZoom: false, attributionControl: true }).setView([41.8827, -87.6233], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
  L.marker([41.8827, -87.6233], { icon: L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [20,20], iconAnchor: [10,10] }) }).addTo(map);
</script>
</body>
</html>
