<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/duha-media-design-system-a9da4886-8cd2-4a89-bc2c-d8fe2794aeca/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/duha-media-design-system-a9da4886-8cd2-4a89-bc2c-d8fe2794aeca/styles.css">
  <script src="_ds/duha-media-design-system-a9da4886-8cd2-4a89-bc2c-d8fe2794aeca/_ds_bundle.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font-body);font-weight:500;}
    :root{/*fade-edge*/--cream:#FFFFFF;--gray-light:#F5F5F4;--accent-primary:#111111;--ground-accent:#C20E59;}
    a{color:var(--ink);}
    a:hover{color:var(--accent-primary);}
  </style>
</helmet>

<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
<dc-import name="SiteHeader" hint-size="100%,72px"></dc-import>

<section data-screen-label="404" style="background:var(--cream);padding:120px 0;position:relative;overflow:hidden;min-height:60vh">
  <div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;bottom:0;background-image:radial-gradient(rgba(17,17,17,.22) 1.2px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:linear-gradient(215deg,#000 15%,transparent 65%);mask-image:linear-gradient(215deg,#000 15%,transparent 65%);z-index:0"></div>
  <div aria-hidden="true" style="position:absolute;right:-180px;top:20%;width:380px;height:380px;background:var(--ground-accent);-webkit-mask-image:url('assets/logo.png');-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;mask-image:url('assets/logo.png');mask-size:contain;mask-repeat:no-repeat"></div>
  
  <div style="position:relative;max-width:var(--container-max);margin:0 auto;padding:0 var(--container-pad)">
    <span style="display:block;font-family:var(--font-display);font-size:clamp(6rem,18vw,14rem);line-height:.9;letter-spacing:-0.02em">404</span>
    <p style="margin:24px 0 0;font-size:var(--text-body-size);line-height:var(--leading-body);max-width:44ch">This page leaked. Unlike your store's demand, it's not coming back.</p>
    <div style="display:flex;gap:14px;margin-top:32px;flex-wrap:wrap">
      <x-import component-from-global-scope="DuhaMediaDesignSystem_a9da48.Button" variant="primary" size="md" href="Book a Call.dc.html" hint-size="160px,48px">Book a Call</x-import>
      <x-import component-from-global-scope="DuhaMediaDesignSystem_a9da48.Button" variant="ghost" size="md" href="Homepage.dc.html" hint-size="120px,48px">Home</x-import>
      <x-import component-from-global-scope="DuhaMediaDesignSystem_a9da48.Button" variant="ghost" size="md" href="Work.dc.html" hint-size="120px,48px">Work</x-import>
    </div>
  </div>
</section>

<dc-import name="SiteFooter" variant="standard" hint-size="100%,420px"></dc-import>
</sc-if>

<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
<div style="background:#DED9D0;min-height:100vh"><div style="max-width:390px;margin:0 auto;background:var(--cream);overflow-x:hidden;box-shadow:0 0 0 1px rgba(17,17,17,.15)">
<dc-import name="SiteHeaderMobile" hint-size="100%,60px"></dc-import>

<section data-screen-label="404" style="background:var(--cream);padding:72px 0 80px;position:relative;overflow:hidden;min-height:60vh">
  <div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;bottom:0;background-image:radial-gradient(rgba(17,17,17,.22) 1.2px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:linear-gradient(215deg,#000 15%,transparent 65%);mask-image:linear-gradient(215deg,#000 15%,transparent 65%);z-index:0"></div>
  <div aria-hidden="true" style="position:absolute;right:-120px;top:12%;width:240px;height:240px;background:var(--ground-accent);-webkit-mask-image:url('assets/logo.png');-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;mask-image:url('assets/logo.png');mask-size:contain;mask-repeat:no-repeat"></div>
  
  <div style="position:relative;padding:0 20px">
    <span style="display:block;font-family:var(--font-display);font-size:clamp(6rem,30vw,9rem);line-height:.9;letter-spacing:-0.02em">404</span>
    <p style="margin:20px 0 0;font-size:1.0625rem;line-height:1.6;max-width:34ch">This page leaked. Unlike your store's demand, it's not coming back.</p>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:28px">
      <x-import component-from-global-scope="DuhaMediaDesignSystem_a9da48.Button" variant="primary" size="md" href="Book a Call.dc.html" style="display:grid" hint-size="100%,52px">Book a Call</x-import>
      <div style="display:flex;gap:12px">
        <x-import component-from-global-scope="DuhaMediaDesignSystem_a9da48.Button" variant="ghost" size="md" href="Homepage.dc.html" style="display:grid;flex:1" hint-size="50%,52px">Home</x-import>
        <x-import component-from-global-scope="DuhaMediaDesignSystem_a9da48.Button" variant="ghost" size="md" href="Work.dc.html" style="display:grid;flex:1" hint-size="50%,52px">Work</x-import>
      </div>
    </div>
  </div>
</section>

<dc-import name="SiteFooterMobile" variant="standard" hint-size="100%,620px"></dc-import>
</div></div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;viewport&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop'|'mobile'&quot;,&quot;section&quot;:&quot;Viewport&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { isDesktop: (this.props.viewport ?? 'desktop') !== 'mobile', isMobile: (this.props.viewport ?? 'desktop') === 'mobile' };
  }
}
</script>
</body>
</html>
