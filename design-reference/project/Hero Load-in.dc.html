<!doctype html>
<!--
  Duha Media — homepage hero load-in + ambient loop (Claude Design handoff, received 2026-10-29)
  Saved by PM. Prototype chrome (toolbar, replay/viewport/copy-variant JS, <template>s) stripped;
  everything that is the port is verbatim.
  HUMAN DIRECTION (binding): "Implement this properly, but don't mess with our colors. We don't
  need the extra bits like the 1 2 3." -> the prototype palette (4-colour bands, its hex values)
  is NOT adopted; the 01/02/03 step motion (rule draw, relay baton, 03 ignite) is NOT ported.

  Prototype edge cases (from its toolbar): "Long headline" (17 words, h1 60px / 34px mobile),
  "No badge" (badge REMOVED so :nth-child re-counts and the regiment closes the gap),
  "No accent" (no wine words), "Reduced motion" (single 200ms fade, intro hidden),
  "With intro" (--t0 2160ms) / "No intro" (--t0 0).

  PORT NOTES (Next.js / Tailwind server component)
  - Split the headline on spaces server-side: <span class="w"><span class="wi" style={{'--i': i}}>word</span></span>.
    Accent-clause words also get class "acc".
  - Intro hand-off: set data-intro (or .intro-on) on the hero wrapper before paint → --t0: 2160ms. No flag → t0 = 0.
  - Breakpoint uses @container hero (max-width:760px); swap for max-md:/media query if preferred.
  - Pause .amb animations (animation-play-state) when the hero leaves the viewport — the pulse repaints its mask.

  TIMING (ms from t0; t0 = 0 standalone, 2160 with intro)
  element            property                                   delay            dur    easing
  header             opacity                                    0                400    ease-out
  dot matrix         clip-path circle from top-right, translate 0                1000   ease-out
  silhouette disc    translateY 48px (140px w/ intro), opacity  0                900/1000 ease-out
  bands 4→1          clip-path grows up into each slice         80/150/220/290   600    ease-out
  eyebrow tick       scale 0→1 (rotated 45°)                    0                360    accordion
  eyebrow text       clip-path wipe L→R                         80               480    ease-out
  side label         clip-path wipe upward                      300              600    ease-out
  H1 word i          translateY(105%)→0 in clip                 100+min(i,12)*36 720    ease-out
  accent words       colour ink→wine                            word + 480       360    accordion
  badge/body/CTA/CTA2 opacity + translateY 24px                 480/550/620/680  450    ease-out
  step rules 01-03   scaleX 0→1                                 700/780/860      520    ease-out
  step labels        opacity + translateY 12px                  740/820/900      450    ease-out
  step 03 number     colour grey→wine                           1040             320    accordion
  [intro only] copy column carry translateY 72px→0              0                1000   ease-out
  -> last motion ends t0 + 1380
  AMBIENT (7s cycle): float 9s alt from 1500 · pieces fan from 1400 (+60/band) · pulse from 4400 · relay from 4800/5400/6000
  ease-out = cubic-bezier(.16,1,.3,1) · accordion = cubic-bezier(.2,.8,.2,1) · panel in-out = cubic-bezier(.76,0,.24,1)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duha Media — Hero Load-in</title>
<style>
.proto{
  --ink:#111111;--cream:#faf7f2;--white:#ffffff;--wine:#c20e59;--grey:#6b665f;
  --rule:rgba(107,102,95,.28);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-acc:cubic-bezier(.2,.8,.2,1);
  --ease-io:cubic-bezier(.76,0,.24,1);
  --t0:0ms;
  --ground:var(--cream);
  box-sizing:border-box;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--ground);
  -webkit-font-smoothing:antialiased;
}
.proto *,.proto *::before,.proto *::after{box-sizing:border-box}
.intro-on{--t0:2160ms}

.viewport{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:1116px;background:var(--ground);container:hero / inline-size}

/* logo band geometry (measured from logo.png: disc 16–297 in a 313 box; bands 16–72, 81–144, 153–219, 228–297) */
.b1{--top:0%;--bot:80.07%;--c:#fce588}
.b2{--top:23.13%;--bot:54.45%;--c:#f5c842}
.b3{--top:48.75%;--bot:27.76%;--c:#e82561}
.b4{--top:75.44%;--bot:0%;--c:#c20e59}
/* each band is its own piece: the full disc, clipped to its slice, so it can move freely */
.mark span,.sun span,.intro-mark span{position:absolute;inset:0;border-radius:50%;clip-path:inset(var(--top) 0 var(--bot) 0);background:var(--c)}

/* header */
.hdr{position:relative;z-index:3;flex:none;display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 max(24px,calc((100% - 1200px) / 2));border-bottom:1px solid var(--rule);
  animation:fade 400ms var(--ease-out) both;animation-delay:var(--t0)}

/* hero */
.hero{position:relative;flex:1 1 auto;overflow:hidden;padding:104px max(24px,calc((100% - 1200px) / 2)) 96px}

.dots{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(17,17,17,.3) 1.2px,transparent 1.5px);
  background-size:22px 22px;background-position:right top;
  -webkit-mask-image:linear-gradient(225deg,#000 0%,rgba(0,0,0,.55) 28%,transparent 62%);
  mask-image:linear-gradient(225deg,#000 0%,rgba(0,0,0,.55) 28%,transparent 62%);
  animation:dots 1000ms var(--ease-out) both;animation-delay:var(--t0)}

.sun{position:absolute;z-index:1;right:8%;top:50%;width:460px;height:460px;margin-top:-230px;
  --rise:48px;animation:sunrise 900ms var(--ease-out) both;animation-delay:var(--t0)}
.intro-on .sun{--rise:140px;animation-duration:1000ms}
.sun-core{position:absolute;inset:0}
.sun span{animation:band 600ms var(--ease-out) both}
.sil-wine .sun span{background:var(--wine)}
.sun .b4{animation-delay:calc(var(--t0) + 80ms)}
.sun .b3{animation-delay:calc(var(--t0) + 150ms)}
.sun .b2{animation-delay:calc(var(--t0) + 220ms)}
.sun .b1{animation-delay:calc(var(--t0) + 290ms)}
.pulse{display:none}

.side{position:absolute;z-index:2;left:max(16px,calc((100% - 1200px) / 2 - 72px));bottom:96px;margin:0;writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);
  animation:side 600ms var(--ease-out) both;animation-delay:calc(var(--t0) + 300ms)}

.inner{position:relative;z-index:2;max-width:780px}
.intro-on .inner{animation:carry 1000ms var(--ease-out) both;animation-delay:var(--t0)}

.eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 28px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.tick{width:9px;height:9px;flex:none;background:var(--wine);transform:rotate(45deg);animation:tick 360ms var(--ease-acc) both;animation-delay:var(--t0)}
.eyebrow-t{animation:wipe 480ms var(--ease-out) both;animation-delay:calc(var(--t0) + 80ms)}

.h1{margin:0;max-width:760px;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:72px;line-height:1;letter-spacing:-.015em;text-transform:uppercase;color:var(--ink)}
.h1.long{font-size:60px}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em .02em .12em;margin:-.06em -.02em -.12em}
.wi{display:inline-block;
  --d:calc(var(--t0) + 100ms + min(var(--i), 12) * 36ms);
  animation:rise 720ms var(--ease-out) both;animation-delay:var(--d)}
.wi.acc{color:var(--wine);
  animation:rise 720ms var(--ease-out) both,ignite 360ms var(--ease-acc) both;
  animation-delay:var(--d),calc(var(--d) + 480ms)}

/* regiment: delay comes from position, so a missing badge closes the gap */
.reg{display:flex;flex-direction:column;align-items:flex-start;margin-top:28px}
.reg>:nth-child(1){--r:480ms}
.reg>:nth-child(2){--r:550ms}
.reg>:nth-child(3){--r:620ms}
.reg>:nth-child(4){--r:700ms}

.badge{display:inline-flex;align-items:center;min-height:32px;margin:0 0 24px;padding:6px 12px;border-radius:4px;background:var(--ink);color:var(--cream);
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  animation:enter 450ms var(--ease-out) both;animation-delay:calc(var(--t0) + var(--r))}
.lede{margin:0 0 36px;max-width:33em;font-size:19px;line-height:1.55;color:var(--grey);
  animation:enter 450ms var(--ease-out) both;animation-delay:calc(var(--t0) + var(--r))}

.ctas{display:flex;gap:12px;margin:0 0 64px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border:2px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);
  font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;text-decoration:none;white-space:nowrap;
  transition:background-color 180ms var(--ease-out),color 180ms var(--ease-out),filter 180ms var(--ease-out);
  animation:enter 450ms var(--ease-out) both;animation-delay:calc(var(--t0) + var(--r))}
.btn + .btn{animation-delay:calc(var(--t0) + var(--r) + 60ms)}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;width:100%;max-width:760px;margin:0;padding:0;list-style:none}
.step{position:relative;padding-top:18px}
.step:nth-child(1){--s:0ms}.step:nth-child(2){--s:80ms}.step:nth-child(3){--s:160ms}
.step::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--rule);transform-origin:0 50%;
  animation:draw 520ms var(--ease-out) both;animation-delay:calc(var(--t0) + var(--r) + var(--s))}
.step:nth-child(3)::before{background:var(--ink)}
.step-in{display:flex;flex-direction:column;gap:6px;animation:enter-sm 450ms var(--ease-out) both;animation-delay:calc(var(--t0) + var(--r) + var(--s) + 40ms)}
.step:nth-child(3) .step-n{color:var(--wine);animation:ignite-n 320ms var(--ease-acc) both;animation-delay:calc(var(--t0) + var(--r) + 340ms)}

/* intro panel (existing site sequence — mocked here for the hand-off; ALREADY BUILT as src/components/IntroAnimation) */
.intro{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#ffffff;
  animation:lift 560ms var(--ease-io) both;animation-delay:2160ms}

/* ambient: starts once the load-in has settled (.amb on the wrapper) */
@property --pulse{syntax:'<length>';inherits:false;initial-value:0px}

/* 1. the mark hovers */
.amb .sun-core{animation:float 9000ms ease-in-out infinite alternate;animation-delay:calc(var(--t0) + 1500ms)}

/* 2. the four logo pieces fan apart in a lazy wave, then click back together — the click sends the pulse */
.amb .sun span{animation:band 600ms var(--ease-out) both,fan 7000ms var(--ease-acc) infinite}
.amb .sun .b4{--fx:10px;--fy:13px;--fr:2deg;animation-delay:calc(var(--t0) + 80ms),calc(var(--t0) + 1400ms)}
.amb .sun .b3{--fx:-8px;--fy:4px;--fr:-1.5deg;animation-delay:calc(var(--t0) + 150ms),calc(var(--t0) + 1460ms)}
.amb .sun .b2{--fx:8px;--fy:-4px;--fr:1.5deg;animation-delay:calc(var(--t0) + 220ms),calc(var(--t0) + 1520ms)}
.amb .sun .b1{--fx:-10px;--fy:-13px;--fr:-2deg;animation-delay:calc(var(--t0) + 290ms),calc(var(--t0) + 1580ms)}

/* 3. a ring of wine dots radiates out of the disc through the matrix */
.amb .pulse{display:block;position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;
  --cx:calc(92% - 230px);--cy:50%;
  background-image:radial-gradient(circle,#c20e59 1.35px,transparent 1.7px);background-size:22px 22px;background-position:right top;
  -webkit-mask-image:radial-gradient(circle at var(--cx) var(--cy),transparent calc(var(--pulse) - 130px),#000 calc(var(--pulse) - 22px),transparent var(--pulse)),linear-gradient(225deg,#000 0%,rgba(0,0,0,.7) 35%,transparent 76%);
  mask-image:radial-gradient(circle at var(--cx) var(--cy),transparent calc(var(--pulse) - 130px),#000 calc(var(--pulse) - 22px),transparent var(--pulse)),linear-gradient(225deg,#000 0%,rgba(0,0,0,.7) 35%,transparent 76%);
  -webkit-mask-composite:source-in;mask-composite:intersect;
  animation:pulse 7000ms cubic-bezier(.22,.61,.36,1) infinite;animation-delay:calc(var(--t0) + 4400ms)}

/* 4. the relay: a wine baton runs Build → Operate → Hand over, then leaves */
.amb .step::after{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--wine);clip-path:inset(0 100% 0 0);
  animation:relay 7000ms cubic-bezier(.65,0,.35,1) infinite;animation-delay:calc(var(--t0) + 4800ms + var(--s) * 7.5)}

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  .viewport *,.viewport *::before,.viewport *::after{animation:none!important}
  .viewport{animation:fade 200ms linear both}
  .intro{display:none}
}

/* keyframes */
@keyframes fade{from{opacity:0}}
@keyframes enter{from{opacity:0;transform:translateY(24px)}}
@keyframes enter-sm{from{opacity:0;transform:translateY(12px)}}
@keyframes rise{from{transform:translateY(105%)}}
@keyframes ignite{from{color:var(--ink)}}
@keyframes ignite-n{from{color:var(--grey)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes side{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes tick{from{transform:rotate(45deg) scale(0)}to{transform:rotate(45deg) scale(1)}}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes dots{from{clip-path:circle(0% at 100% 0%);transform:translate(16px,-16px)}to{clip-path:circle(150% at 100% 0%);transform:none}}
@keyframes sunrise{from{opacity:0;transform:translateY(var(--rise))}35%{opacity:1}to{opacity:1;transform:none}}
@keyframes band{from{clip-path:inset(calc(100% - var(--bot)) 0 var(--bot) 0)}to{clip-path:inset(var(--top) 0 var(--bot) 0)}}
@keyframes carry{from{transform:translateY(72px)}}
@keyframes lift{to{transform:translateY(-100%)}}
@keyframes float{from{transform:none}to{transform:translateY(-10px)}}
@keyframes fan{
  0%{transform:none}
  22%{transform:translate(var(--fx),var(--fy)) rotate(var(--fr))}
  32%{transform:translate(var(--fx),var(--fy)) rotate(var(--fr));animation-timing-function:cubic-bezier(.5,0,.2,1.35)}
  42%{transform:none}
  100%{transform:none}
}
@keyframes pulse{0%{--pulse:0px;opacity:0}5%{opacity:1}50%{--pulse:1200px;opacity:0}100%{--pulse:1200px;opacity:0}}
@keyframes relay{0%{clip-path:inset(0 100% 0 0)}9%{clip-path:inset(0 0 0 0)}18%{clip-path:inset(0 0 0 100%)}100%{clip-path:inset(0 0 0 100%)}}

/* mobile */
@container hero (max-width:760px){
  .hero{padding:40px 16px 48px}
  .sun{width:280px;height:280px;right:-84px;top:-64px;margin-top:0}
  .amb .pulse{--cx:calc(100% - 56px);--cy:76px}
  .side{display:none}
  .eyebrow{gap:10px;margin-bottom:20px;font-size:11px;letter-spacing:.12em}
  .h1{font-size:40px;line-height:1.02}
  .h1.long{font-size:34px}
}
</style>
</head>
<body>
<div class="proto intro-on amb">
  <div class="viewport">
    <header class="hdr">…site header…</header>
    <section class="hero" aria-labelledby="hero-title">
      <div class="dots" aria-hidden="true"></div>
      <div class="pulse" aria-hidden="true"></div>
      <div class="sun" aria-hidden="true"><div class="sun-core"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span></div></div>
      <p class="side" aria-hidden="true">Build · Operate · Hand over</p>
      <div class="inner">
        <p class="eyebrow"><span class="tick" aria-hidden="true"></span><span class="eyebrow-t">Integrated ecommerce growth partner — Chicago</span></p>
        <h1 class="h1" id="hero-title"><span class="w"><span class="wi" style="--i:0">Your</span></span> <span class="w"><span class="wi" style="--i:1">ecommerce</span></span> <span class="w"><span class="wi" style="--i:2">growth</span></span> <span class="w"><span class="wi" style="--i:3">team,</span></span> <span class="w"><span class="wi acc" style="--i:4">until</span></span> <span class="w"><span class="wi acc" style="--i:5">you</span></span> <span class="w"><span class="wi acc" style="--i:6">don’t</span></span> <span class="w"><span class="wi acc" style="--i:7">need</span></span> <span class="w"><span class="wi acc" style="--i:8">one.</span></span></h1>
        <div class="reg">
          <p class="badge">[$X.XM client revenue tracked]</p>
          <p class="lede">…</p>
          <div class="ctas"><a class="btn btn-primary">Book a Call →</a><a class="btn btn-ghost">See the Work</a></div>
          <ol class="steps">…01 Build · 02 Operate · 03 Hand over…</ol>
        </div>
      </div>
    </section>
  </div>
</div>
</body>
</html>
