<!-- @dsCard group="Actions" height=150 subtitle="Primary, secondary, ghost" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans)}
.wrap{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-6)}
.row{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap}
.btn{font-family:var(--font-sans);font-size:14px;line-height:1.4;letter-spacing:.02em;border-radius:var(--radius-sm);padding:var(--space-2\.5) var(--space-5);cursor:pointer}
.primary{background:var(--cta);color:var(--white);border:1.5px solid var(--cta);font-weight:700}
.primary:hover,.primary.is-hover{background:var(--cta-hover);border-color:var(--cta-hover)}
.secondary{background:transparent;color:var(--text);border:1.5px solid var(--text);font-weight:500}
.ghost{background:none;border:0;padding:0;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;color:var(--link)}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body>
<div class="wrap">
  <div class="row">
    <button class="btn primary">Get a free site audit</button>
    <button class="btn secondary">Book a call</button>
    <button class="btn ghost">View case study →</button>
  </div>
  <div class="row"><span class="cap">Hover</span><button class="btn primary is-hover">Get a free site audit</button></div>
</div>
<script>/* static preview */</script>
</body></html>
